name: stoperica

x-api-env: &api-env
  DATABASE_URL: postgresql://stoperica:${POSTGRES_PASSWORD:?}@db:5432/stoperica
  JWT_SECRET: ${JWT_SECRET:?}
  CORS_ORIGIN: https://${DOMAIN:?}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stoperica
      POSTGRES_USER: stoperica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stoperica -d stoperica"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: { context: ., target: api }
    image: stoperica-api
    user: root
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., target: api }
    image: stoperica-api
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: ., target: web }
    image: stoperica-web
    restart: unless-stopped
    depends_on: [api]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
